[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CodexTradingEngine"
version = "2.1.0"
description = "Simulation-first crypto telemetry, arbitrage research, receipt, and safety engine for Termux and Python."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ArchitectofAthena"}]

dependencies = [
    "aiohttp==3.14.3",
    "PyYAML==6.0.3",
    "feedparser==6.0.14",
    "jsonschema>=4.26.0,<5",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
codex = "eve_q.alpha_frontdoor:main"
codex-alpha-doctor = "eve_q.alpha_doctor:main"
codex-alpha-run = "eve_q.alpha_operator:main"
codex-gate1 = "eve_q.gate1_readonly_runtime:main"
codex-gate1-closure = "eve_q.gate1_closure:main"
codex-gate1-consensus = "eve_q.gate1_source_consensus:main"
codex-gate1-soak25 = "eve_q.sepolia_soak_campaign:main"
codex-gate1a1 = "eve_q.gate1a1_evidence_convergence:main"
codex-gate1a1-benchmark = "eve_q.gate1a1_benchmark_corpus:main"
codex-gate1a1-source-review = "eve_q.gate1a1_second_source_review:main"
codex-research = "eve_q.research_cli:main"
codex-telemetry-draft = "eve_q.telemetry_draft_fixture:main"
codex-viv-gauntlet = "eve_q.viv_adversarial:main"
codex-viv-market-gauntlet = "eve_q.viv_market_adversarial:main"
omega-context = "omega_telemetry.context_runner:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
quantum = [
    "qiskit==2.5.1",
]
security = [
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
]

[tool.setuptools]
py-modules = [
    "eveq_failsafe_receipt",
    "proof_adapters",
    "shadow_cycle_runner",
]

[tool.setuptools.packages.find]
include = ["eve_q*", "models*", "omega_telemetry*"]

[tool.setuptools.package-data]
eve_q = ["organ_contract.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "ASYNC",
]
ignore = ["E501"]
per-file-ignores = { "eve_q/alpha_doctor.py" = ["I001", "UP035"], "tests/test_alpha_doctor_v0_1.py" = ["I001"], "eve_q/telemetry_draft_fixture.py" = ["I001", "UP017"], "tests/test_telemetry_draft_fixture_v0_1.py" = ["I001", "UP017"], "eve_q/alpha_operator.py" = ["I001", "UP017"], "tests/test_alpha_operator_v0_1.py" = ["I001", "UP017"], "eve_q/sepolia_soak_campaign.py" = ["I001", "UP017"], "tests/test_sepolia_soak_campaign_v0_1.py" = ["I001", "UP017"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --tb=short --cov=. --cov-report=term-missing:skip-covered --cov-report=html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "shadow: shadow cycle tests",
    "live: live trading tests (requires human review)",
    "asyncio: async tests",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 56
