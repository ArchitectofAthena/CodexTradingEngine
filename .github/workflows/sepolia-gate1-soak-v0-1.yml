name: Sepolia Gate 1A 25-Capture Soak v0.1

on:
  pull_request:
    paths:
      - "eve_q/sepolia_soak_campaign.py"
      - "tests/test_sepolia_soak_campaign_v0_1.py"
      - "pyproject.toml"
      - ".github/workflows/sepolia-gate1-soak-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sepolia-gate1-soak-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak-formatter:
    name: Sepolia soak formatter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev]'

      - name: Run synthetic suite before formatting
        run: |
          python -m pytest \
            -o addopts='' \
            -q \
            --strict-markers \
            tests/test_sepolia_soak_campaign_v0_1.py \
            tests/test_sepolia_blockscout_source_v0_1.py

      - name: Apply exact Ruff and Black formatting
        run: |
          python -m ruff check --fix \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py
          python -m black \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py
          python -m ruff check \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py
          python -m black --check \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py

      - name: Re-run synthetic suite
        run: |
          python -m pytest \
            -o addopts='' \
            -q \
            --strict-markers \
            tests/test_sepolia_soak_campaign_v0_1.py \
            tests/test_sepolia_blockscout_source_v0_1.py

      - name: Commit formatter output only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py; then
            echo "Formatter output already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eve_q/sepolia_soak_campaign.py \
            tests/test_sepolia_soak_campaign_v0_1.py
          git commit -m "Apply exact formatting to Sepolia soak surfaces"
          git push origin "HEAD:${{ github.head_ref }}"
