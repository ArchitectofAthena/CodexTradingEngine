name: Telemetry Draft Fixture v0.1 CI

on:
  pull_request:
    paths:
      - "eve_q/telemetry_draft_fixture.py"
      - "schemas/telemetry_fixture_mapping_v0_1.schema.json"
      - "schemas/telemetry_draft_fixture_v0_1.schema.json"
      - "tests/test_telemetry_draft_fixture_v0_1.py"
      - "docs/alpha/TELEMETRY_DRAFT_FIXTURE_ADAPTER_v0_1.md"
      - "examples/alpha/**"
      - "pyproject.toml"
      - ".github/workflows/telemetry-draft-fixture-v0-1-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-draft-fixture-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-draft-fixture:
    name: Telemetry draft fixture formatter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev]'

      - name: Run focused fail-closed tests before formatting
        run: |
          python -m pytest \
            -o addopts='' \
            -q \
            --strict-markers \
            tests/test_telemetry_draft_fixture_v0_1.py

      - name: Apply exact Black formatting
        run: |
          python -m black \
            eve_q/telemetry_draft_fixture.py \
            tests/test_telemetry_draft_fixture_v0_1.py
          python -m black --check \
            eve_q/telemetry_draft_fixture.py \
            tests/test_telemetry_draft_fixture_v0_1.py

      - name: Commit formatter output only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            eve_q/telemetry_draft_fixture.py \
            tests/test_telemetry_draft_fixture_v0_1.py; then
            echo "Formatter output already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eve_q/telemetry_draft_fixture.py \
            tests/test_telemetry_draft_fixture_v0_1.py
          git commit -m "Apply exact Black formatting to telemetry draft adapter"
          git push origin "HEAD:${{ github.head_ref }}"
