name: Lint and Format

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Black on constitutional surfaces
        run: |
          black --check --diff \
            eve_q/cross_repo_ingestor.py \
            eve_q/receipt_emitter.py \
            eve_q/alert_dispatcher.py \
            eve_q/risk_management.py \
            eve_q/organ_contract.py \
            eve_q/ttl_policy.py \
            eve_q/artifact_carrier.py \
            eve_q/membrane_tool.py \
            eve_q/receipt_carrier_attestation.py \
            eve_q/allocation/charity_router.py \
            eve_q/allocation/geodesic_policy.py \
            eve_q/telemetry/impact_score.py \
            eve_q/telemetry/need_score.py \
            models/__init__.py \
            tests/test_cross_repo_ingestor.py \
            tests/test_receipt_emitter.py \
            tests/test_alert_dispatcher.py \
            tests/test_risk_management.py \
            tests/test_organ_contract_scaffold.py \
            tests/test_organ_contract_enforcement.py \
            tests/test_ttl_policy_scaffold.py \
            tests/test_ttl_policy_evaluator.py \
            tests/test_artifact_carrier_manifest.py \
            tests/test_artifact_carrier_example.py \
            tests/test_receipt_carrier_attestation.py \
            tests/test_receipt_carrier_attestation_example.py \
            tests/test_readme_constitutional_surface_index.py \
            tests/test_receipt_carrier_attestation_cli.py \
            tests/test_artifact_carrier_cli.py \
            tests/test_membrane_tool.py \
            tests/test_membrane_tool_usage_docs.py \
            tests/test_constitutional_membrane_checkpoint.py \
            tests/test_constitutional_release_audit.py \
            tests/test_charity_allocation_diversity_guard.py \
            tests/test_need_impact_scoring.py \
            tests/test_package_imports.py

      - name: Run Flake8 on constitutional surfaces
        run: |
          flake8 \
            eve_q/cross_repo_ingestor.py \
            eve_q/receipt_emitter.py \
            eve_q/alert_dispatcher.py \
            eve_q/risk_management.py \
            eve_q/organ_contract.py \
            eve_q/ttl_policy.py \
            eve_q/artifact_carrier.py \
            eve_q/membrane_tool.py \
            eve_q/receipt_carrier_attestation.py \
            eve_q/allocation/charity_router.py \
            eve_q/allocation/geodesic_policy.py \
            eve_q/telemetry/impact_score.py \
            eve_q/telemetry/need_score.py \
            models/__init__.py \
            tests/test_cross_repo_ingestor.py \
            tests/test_receipt_emitter.py \
            tests/test_alert_dispatcher.py \
            tests/test_risk_management.py \
            tests/test_organ_contract_scaffold.py \
            tests/test_organ_contract_enforcement.py \
            tests/test_ttl_policy_scaffold.py \
            tests/test_ttl_policy_evaluator.py \
            tests/test_artifact_carrier_manifest.py \
            tests/test_charity_allocation_diversity_guard.py \
            tests/test_need_impact_scoring.py \
            tests/test_package_imports.py
