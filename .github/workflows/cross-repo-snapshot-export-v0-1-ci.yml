name: Cross-Repository Snapshot Export v0.1 CI

on:
  pull_request:
    paths:
      - "eve_q/cross_repo_snapshot_export.py"
      - "schemas/cross_repo_snapshot_envelope_v0_1.schema.json"
      - "tests/test_cross_repo_snapshot_export_v0_1.py"
      - "docs/telemetry/EVE_Q_CROSS_REPO_SNAPSHOT_EXPORT_v0_1.md"
      - ".github/workflows/cross-repo-snapshot-export-v0-1-ci.yml"
  push:
    branches: [main]
    paths:
      - "eve_q/cross_repo_snapshot_export.py"
      - "schemas/cross_repo_snapshot_envelope_v0_1.schema.json"
      - "tests/test_cross_repo_snapshot_export_v0_1.py"
      - "docs/telemetry/EVE_Q_CROSS_REPO_SNAPSHOT_EXPORT_v0_1.md"
      - ".github/workflows/cross-repo-snapshot-export-v0-1-ci.yml"

permissions:
  contents: read

concurrency:
  group: cross-repo-snapshot-export-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Snapshot export membrane (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Parse schema and compile exporter
        run: |
          python -m json.tool schemas/cross_repo_snapshot_envelope_v0_1.schema.json >/dev/null
          python -m py_compile eve_q/cross_repo_snapshot_export.py

      - name: Run export invariants and inherited snapshot tests
        run: |
          python -m pytest -q --no-cov \
            tests/test_cross_repo_snapshot_export_v0_1.py \
            tests/test_live_read_only_telemetry_v0_1.py
