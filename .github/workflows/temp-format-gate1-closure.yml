name: Temporary Gate 1 Closure Formatter

on:
  push:
    branches:
      - gate1-closure-packet-v0-1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gate1-closure-packet-v0-1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply exact repository formatter
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black \
            eve_q/gate1_closure.py \
            tests/test_gate1_closure_v0_1.py

      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eve_q/gate1_closure.py tests/test_gate1_closure_v0_1.py
          git commit -m 'style: format Gate 1 closure packet'
          git push origin HEAD:gate1-closure-packet-v0-1
