name: ViV Adversarial Sandbox v0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eve_q/viv_adversarial.py'
      - 'tests/test_viv_adversarial_v0_1.py'
      - 'schemas/viv_adversarial_receipt_v0_1.schema.json'
      - 'docs/VIV_ADVERSARIAL_SANDBOX_v0_1.md'
      - 'receipts/changes/viv_adversarial_sandbox_v0_1.json'
      - 'receipts/changes/viv_recursive_correction_runs_v0_1.json'
      - 'pyproject.toml'
      - '.github/workflows/viv-adversarial-sandbox-v0-1.yml'
  push:
    branches: [main]
    paths:
      - 'eve_q/viv_adversarial.py'
      - 'tests/test_viv_adversarial_v0_1.py'
      - 'schemas/viv_adversarial_receipt_v0_1.schema.json'
      - 'docs/VIV_ADVERSARIAL_SANDBOX_v0_1.md'
      - 'receipts/changes/viv_adversarial_sandbox_v0_1.json'
      - 'receipts/changes/viv_recursive_correction_runs_v0_1.json'
      - 'pyproject.toml'
      - '.github/workflows/viv-adversarial-sandbox-v0-1.yml'

permissions:
  contents: read

jobs:
  viv-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test surface
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Python syntax
        run: python -m compileall -q eve_q/viv_adversarial.py tests/test_viv_adversarial_v0_1.py

      - name: Schema and provenance JSON
        run: |
          python -m json.tool schemas/viv_adversarial_receipt_v0_1.schema.json >/dev/null
          python -m json.tool receipts/changes/viv_adversarial_sandbox_v0_1.json >/dev/null
          python -m json.tool receipts/changes/viv_recursive_correction_runs_v0_1.json >/dev/null

      - name: Focused ViV tests
        run: pytest -q tests/test_viv_adversarial_v0_1.py --no-cov

      - name: Build deterministic baseline candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from eve_q.simulation_runs import build_simulation_run

          candidate = build_simulation_run(
              strategy_id="eve_q.shadow_v0",
              seed=12345,
              market_snapshot_hash="sha256:market",
              candidate_count=3,
              accepted_count=1,
              rejected_count=2,
              result_summary_hash="sha256:summary",
              risk_flags=[],
              perturbation_id="perturbation-viv-ci",
              created_at="2026-08-05T00:00:00Z",
          )
          output_dir = Path("artifacts/viv")
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "simulation-run.json").write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run recursive ViV correction gauntlets
        run: |
          set -euo pipefail
          for seed in 0 7331 424242; do
            codex-viv-gauntlet \
              --candidate artifacts/viv/simulation-run.json \
              --validator simulation_run \
              --seed "${seed}" \
              --created-at 2026-08-05T00:00:00Z \
              --receipt-out "artifacts/viv/viv-receipt-${seed}.json" \
              > "artifacts/viv/viv-cli-${seed}.json"
          done

      - name: Validate recursive runtime receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from eve_q.viv_adversarial import validate_viv_receipt

          expected_receipt_ids = {
              0: "sha256:e2f10ca5fc6c24e0a688b7e48b6a66104572e78793c769ddc70cfe85124645f6",
              7331: "sha256:3643d36d35811df70b7b83842918fdda55f39624fba4f0168d694b9bc333fd08",
              424242: "sha256:3572a57af6571402e2ff9bd15ced378a04efa22bd04d42390730a234abbd893c",
          }
          summaries = []
          receipt_paths = sorted(Path("artifacts/viv").glob("viv-receipt-*.json"))
          if len(receipt_paths) != len(expected_receipt_ids):
              raise SystemExit(
                  f"expected {len(expected_receipt_ids)} runtime receipts, found {len(receipt_paths)}"
              )

          observed_seeds = set()
          for path in receipt_paths:
              receipt = json.loads(path.read_text(encoding="utf-8"))
              validate_viv_receipt(receipt)
              seed = receipt["seed"]
              observed_seeds.add(seed)
              if receipt["overall_outcome"] != "pass":
                  raise SystemExit(f"{path}: correction run did not pass")
              if receipt["blocked_count"] != receipt["case_count"]:
                  raise SystemExit(f"{path}: not every configured mutation was blocked")
              if receipt["escaped_count"] != 0 or receipt["repair_required"] is not False:
                  raise SystemExit(f"{path}: escaped mutation or repair flag detected")
              if receipt["receipt_id"] != expected_receipt_ids.get(seed):
                  raise SystemExit(
                      f"{path}: receipt digest drift for seed {seed}: {receipt['receipt_id']}"
                  )
              summaries.append(
                  {
                      "seed": seed,
                      "receipt_id": receipt["receipt_id"],
                      "blocked_count": receipt["blocked_count"],
                      "escaped_count": receipt["escaped_count"],
                      "candidate_unchanged": receipt["candidate_unchanged"],
                  }
              )

          if observed_seeds != set(expected_receipt_ids):
              raise SystemExit(
                  f"seed coverage mismatch: expected {sorted(expected_receipt_ids)}, "
                  f"observed {sorted(observed_seeds)}"
              )

          print(json.dumps({"ok": True, "recursive_runs": summaries}, sort_keys=True))
          PY
