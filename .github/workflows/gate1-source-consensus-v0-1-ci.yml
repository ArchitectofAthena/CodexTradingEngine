name: Gate 1 Source Consensus v0.1 CI

on:
  pull_request:
    paths:
      - "eve_q/gate1_source_consensus.py"
      - "schemas/gate1_source_consensus_packet_v0_1.schema.json"
      - "schemas/gate1_source_consensus_decision_v0_1.schema.json"
      - "tests/test_gate1_source_consensus_v0_1.py"
      - "examples/alpha/source_consensus_independent_agreement_v0_1.json"
      - "docs/alpha/GATE1_SOURCE_CONSENSUS_EVIDENCE_v0_1.md"
      - "pyproject.toml"
      - ".github/workflows/gate1-source-consensus-v0-1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-source-consensus-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-consensus:
    name: Source consensus (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev]'

      - name: Compile and validate JSON contracts
        run: |
          python -m py_compile eve_q/gate1_source_consensus.py
          python -m json.tool schemas/gate1_source_consensus_packet_v0_1.schema.json > /dev/null
          python -m json.tool schemas/gate1_source_consensus_decision_v0_1.schema.json > /dev/null
          python -m json.tool examples/alpha/source_consensus_independent_agreement_v0_1.json > /dev/null

      - name: Run focused refusal matrix
        run: |
          python -m pytest \
            -o addopts='' \
            -q \
            --strict-markers \
            tests/test_gate1_source_consensus_v0_1.py

      - name: Run focused lint and format checks
        run: |
          python -m ruff check \
            eve_q/gate1_source_consensus.py \
            tests/test_gate1_source_consensus_v0_1.py
          python -m black --check \
            eve_q/gate1_source_consensus.py \
            tests/test_gate1_source_consensus_v0_1.py

      - name: Exercise independent observation-only example
        run: |
          codex-gate1-consensus evaluate \
            --packet examples/alpha/source_consensus_independent_agreement_v0_1.json \
            --output-dir artifacts/source-consensus-example
          codex-gate1-consensus verify \
            --decision artifacts/source-consensus-example/source-consensus-decision.json
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path(
                  "artifacts/source-consensus-example/source-consensus-decision.json"
              ).read_text(encoding="utf-8")
          )
          assert decision["decision"]["code"] == "ACCEPT_OBSERVATION_ONLY"
          assert decision["decision"]["observation_only"] is True
          comparison = decision["comparison"]
          assert comparison["independent_provenance"] is True
          assert comparison["conflict_magnitude"] == "0.1"
          assert comparison["aggregate_value"] is None
          assert comparison["aggregation_performed"] is False
          assert all(value == 0 for value in decision["counts"].values())
          boundary = decision["authority"]
          assert boundary["authority"] is False
          assert boundary["network_access_allowed"] is False
          assert boundary["may_generate_live_proposal"] is False
          assert boundary["may_execute"] is False
          assert boundary["may_sign"] is False
          assert boundary["may_submit_transaction"] is False
          assert boundary["may_move_capital"] is False
          PY
