name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Static, dependency, secret, workflow, container, and leak audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned audit tools
        run: |
          python -m pip install --disable-pip-version-check \
            bandit==1.9.4 \
            pip-audit==2.10.1

      - name: Compile security scanners
        run: |
          python -m py_compile \
            scripts/security_audit_v0_1.py \
            scripts/leak_audit_v0_2.py

      - name: Run repository-native audit
        run: |
          python scripts/security_audit_v0_1.py \
            --fail-on HIGH \
            --json security-artifacts/security-audit.json \
            --markdown security-artifacts/security-audit.md

      - name: Run leak and exposure audit
        run: |
          python scripts/leak_audit_v0_2.py \
            --fail-on HIGH \
            --json security-artifacts/leak-audit.json \
            --markdown security-artifacts/leak-audit.md

      - name: Run high-confidence Bandit audit
        run: |
          mkdir -p security-artifacts
          bandit -r eve_q \
            -x tests \
            -lll -iii \
            -f json \
            -o security-artifacts/bandit.json

      - name: Audit runtime dependencies
        run: |
          mkdir -p security-artifacts
          python -m pip_audit \
            -r requirements.txt \
            -f json \
            -o security-artifacts/pip-audit.json

      - name: Upload redacted security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-security-audit
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30
