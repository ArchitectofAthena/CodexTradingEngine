name: Full-History Secret Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "11 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-history-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full-history audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout complete history without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run event-range scan and install pinned Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # The pinned action intentionally limits push/PR scans to the event range.
      # Explicitly scan every fetched branch/tag so the full-history label is true.
      - name: Scan complete fetched Git history
        if: always()
        run: >-
          gitleaks git --log-opts=--all --redact --exit-code=2
          --config .gitleaks.toml --report-format json
          --report-path "$RUNNER_TEMP/gitleaks-full-history.json" .

      - name: Record location-only full-history findings
        if: always()
        env:
          GITLEAKS_SCOPE_REPORT: ${{ runner.temp }}/gitleaks-full-history.json
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["GITLEAKS_SCOPE_REPORT"])
          present = source.is_file()
          rows = json.loads(source.read_text(encoding="utf-8")) if present else []
          allowed = ("File", "StartLine", "EndLine", "RuleID", "Commit", "Fingerprint")
          findings = [{key: row.get(key) for key in allowed} for row in rows]
          report = {
              "scan_scope": "all_fetched_refs",
              "scanner_version": "8.30.1",
              "scan_report_present": present,
              "finding_count": len(findings) if present else None,
              "findings": findings,
              "review_state": "HOLD" if findings or not present else "NO_FINDINGS",
              "artifact_is_command": False,
              "authority": False,
              "human_promotion_required": True,
          }
          destination = Path("security-artifacts/full-history-findings.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PYCODE

      - name: Upload location-only secret-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-full-history-findings
          path: security-artifacts/full-history-findings.json
          if-no-files-found: error
          retention-days: 30
