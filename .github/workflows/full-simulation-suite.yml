name: Full Simulation Suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-simulation-suite:
    name: Python ${{ matrix.python-version }} simulation suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e '.[test]'
          python -m pip install build
          python -m pip check

      - name: Build and smoke-test the packaged public surface
        run: |
          python -m build --wheel --outdir dist
          python -m venv /tmp/codex-wheel-smoke
          /tmp/codex-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/codex-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/codex-wheel-smoke/bin/python - <<'PY'
          import hashlib
          import json
          from importlib.resources import files

          import eve_q
          import eveq_failsafe_receipt
          import models
          import omega_telemetry
          import proof_adapters
          import shadow_cycle_runner
          from eve_q.research_cli import main
          from eve_q.rust_verifier_provenance import canonical_response_schema_sha256

          assert eve_q is not None
          assert eveq_failsafe_receipt is not None
          assert models is not None
          assert omega_telemetry is not None
          assert proof_adapters is not None
          assert shadow_cycle_runner is not None
          assert main is not None

          schema_bytes = files("eve_q").joinpath("delta_repricing_response.schema.json").read_bytes()
          schema = json.loads(schema_bytes)
          assert schema["properties"]["schema_version"]["const"] == "delta-repricing-response-v0.1"
          assert hashlib.sha256(schema_bytes).hexdigest() == canonical_response_schema_sha256()
          PY
          /tmp/codex-wheel-smoke/bin/codex-research --help
          /tmp/codex-wheel-smoke/bin/codex-rust-verifier-provenance verify --help

      - name: Test and build isolated Rust verifiers
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: |
          cargo test --manifest-path rust/delta-verifier/Cargo.toml
          cargo build --manifest-path rust/delta-verifier/Cargo.toml --bins

      - name: Run complete simulation-safe test suite
        env:
          CODEX_DELTA_VERIFIER_BIN: ${{ github.workspace }}/rust/delta-verifier/target/debug/codex-delta-verifier
          CODEX_FLASH_LIQUIDITY_VERIFIER_BIN: ${{ github.workspace }}/rust/delta-verifier/target/debug/codex-flash-liquidity-verifier
        run: |
          python -m pytest \
            -o addopts='' \
            -ra \
            --strict-markers \
            -m "not live" \
            --cov=eve_q \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            tests/

      - name: Upload simulation test and package artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulation-test-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
            dist/*.whl
          if-no-files-found: warn
