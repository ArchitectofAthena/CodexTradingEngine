name: Full Simulation Suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-simulation-suite:
    name: Python ${{ matrix.python-version }} simulation suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # reviewed immutable ref
        with:
          toolchain: "1.97.1"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Test and build isolated Rust verifiers
        run: |
          cargo test --manifest-path rust/delta-verifier/Cargo.toml
          cargo build --manifest-path rust/delta-verifier/Cargo.toml --bins

      - name: Run complete simulation-safe test suite
        env:
          CODEX_DELTA_VERIFIER_BIN: ${{ github.workspace }}/rust/delta-verifier/target/debug/codex-delta-verifier
          CODEX_FLASH_LIQUIDITY_VERIFIER_BIN: ${{ github.workspace }}/rust/delta-verifier/target/debug/codex-flash-liquidity-verifier
        run: |
          python -m pytest \
            -o addopts='' \
            -ra \
            --strict-markers \
            -m "not live" \
            --cov=eve_q \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            tests/

      - name: Upload simulation test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: simulation-test-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
