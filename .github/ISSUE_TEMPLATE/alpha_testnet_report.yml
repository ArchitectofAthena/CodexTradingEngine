name: Alpha testnet report
description: Report a bounded Gate 1A public-testnet observation and local simulation run.
title: "[ALPHA TESTNET] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Gate 1A is testnet-only and read-only. Do not include secrets, wallet material, credentials, personally identifying data, private logs, mainnet account data, or sensitive exploit details. The engine must remain unable to sign, submit transactions, or move capital.

  - type: input
    id: commit
    attributes:
      label: Exact commit SHA
      description: Paste the 40-character commit produced by `git rev-parse HEAD`.
      placeholder: 40-character commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, installation mode, and whether Rust verifiers were compiled locally.
      placeholder: Termux / Android 16, Python 3.13, editable install, Rust compiled from checkout
    validations:
      required: true

  - type: input
    id: network
    attributes:
      label: Public testnet and chain ID
      description: Name the public testnet and chain ID when known. Mainnet runs are outside Gate 1A.
      placeholder: Example public testnet, chain ID 00000
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Read-only source class and exact host
      description: Identify the public GET/HEAD source class and exact hostname. Do not paste credentials or private query values.
      placeholder: Public testnet explorer API, data.example.org
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Exact commands
      description: Include the capture and `codex-research` commands after removing private local paths when needed.
      render: shell
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary status
      description: Paste the PIPELINE, ECONOMICS, and EXECUTION states from the human-readable report.
      placeholder: |
        PIPELINE=READY
        ECONOMICS=NO_POSITIVE_EDGE
        EXECUTION=LOCKED
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Reproduction artifacts
      description: List safe artifact IDs, snapshot hashes, receipt hashes, or report paths needed to reproduce. Do not upload private data.
      render: text
    validations:
      required: true

  - type: dropdown
    id: primary_surface
    attributes:
      label: Primary finding
      options:
        - Installation or operator workflow
        - Environment or local-binary trust
        - Testnet source policy or transport
        - Freshness, provenance, or replay
        - Simulation mechanics
        - Classical versus QAOA comparison
        - Modeled economics
        - Receipt or summary usability
        - Rollback or kill-switch behavior
        - Execution-lock enforcement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: dropdown
    id: rollback
    attributes:
      label: Rollback status
      options:
        - Not triggered; run completed within Gate 1A
        - Triggered and returned to Gate 0 successfully
        - Triggered but rollback behavior was unclear or failed
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Gate 1A boundary confirmation
      options:
        - label: I used a public blockchain testnet, not mainnet.
          required: true
        - label: I used only public read-only observation sources compatible with GET or HEAD.
          required: true
        - label: I did not include a seed phrase, private key, signing key, trading credential, wallet secret, or write-capable credential.
          required: true
        - label: The engine did not construct, sign, submit, or broadcast a transaction.
          required: true
        - label: The final report preserved `EXECUTION=LOCKED`.
          required: true
        - label: I removed personally identifying data, private logs, and sensitive exploit details from this public report.
          required: true
        - label: I tested only systems and data I own or am authorized to test.
          required: true
