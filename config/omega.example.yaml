log_level: INFO
http_timeout_seconds: 30

database_path: data/omega_telemetry.sqlite
health_path: logs/omega_health.json
health_interval_seconds: 30

boundary:
  authority: false
  shadow_mode: true
  may_execute: false
  may_execute_trades: false
  may_sign: false
  may_broadcast: false
  may_move_capital: false

observers:
  - name: base_context
    enabled: true
    poll_interval_seconds: 60

sentiment:
  enabled: false
  rules_path: rules/market_signal_rules.json
  cooldown_minutes: 10
  poll_interval_seconds: 60
  min_score: 3.0
  spike_window_minutes: 15
  spike_threshold_count: 5
  # Every enabled source must use HTTPS, list its exact allowed host,
  # disable redirect dependence, and keep timeout/body limits bounded.
  sources:
    # - name: reviewed_public_feed
    #   type: json
    #   url: https://feeds.example.org/signals.json
    #   allowed_hosts:
    #     - feeds.example.org
    #   items_path:
    #     - items
    #   timeout_seconds: 10
    #   max_response_bytes: 1048576
    []

whale:
  enabled: false
  price_timeout_seconds: 15
  symbol_to_coingecko_id:
    ETH: ethereum
    BTC: bitcoin
  chains:
    - name: base
      enabled: false
      rpc_url: https://rpc.example.invalid
      rpc_timeout_seconds: 20
      poll_interval_seconds: 15
      max_blocks_per_poll: 25
      cooldown_minutes: 10
      native_asset:
        symbol: ETH
        decimals: 18
        usd_threshold: "250000"
      token_usd_threshold: "250000"
      exchange_labels: {}
      erc20_tokens: []

alerts:
  shadow_mode: true
  telegram:
    enabled: false
  discord:
    enabled: false
