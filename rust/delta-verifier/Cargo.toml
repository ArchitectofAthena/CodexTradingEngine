[package]
name = "codex-delta-verifier"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Pure Rust exact verifier for simulation-only triangular arbitrage candidates"

[package.metadata.gate1a1]
provenance_manifest_schema = "gate1a1-rust-verifier-manifest-v0.1"
provenance_report_schema = "gate1a1-rust-verifier-report-v0.1"
input_schema = "delta-repricing-request-v0.1"
output_schema = "delta-repricing-response-v0.1"
authority = false

[lib]
name = "codex_delta_verifier"
path = "src/lib.rs"

[[bin]]
name = "codex-delta-verifier"
path = "src/main.rs"

[[bin]]
name = "codex-flash-liquidity-verifier"
path = "src/bin/codex-flash-liquidity-verifier.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
